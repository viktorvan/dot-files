# ── Terminal ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # 24-bit color for standard xterm
set -as terminal-features ",xterm-ghostty:RGB"    # 24-bit color for Ghostty's native TERM
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'                           # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # undercurl colour

# ── Core options ──────────────────────────────────────────────────────────────
set -g mouse on
set -g focus-events on    # lets neovim's autoread/FocusGained work across pane switches
set -g escape-time 0      # no esc delay (important for neovim)
set -g status-interval 5  # refresh status bar every 5s

unbind -n tab
unbind -n C-i

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Window / pane indexing ────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top

# ── Pane navigation (vim-tmux-navigator) ──────────────────────────────────────
# Colemak-mapped keys matching the neovim plugin config:
#   ˛ = left   ' = down   é = up   ı = right
# Direct bind-key approach (avoids vim-tmux-navigator plugin shell-quoting issues with Unicode)
# key (Ghostty) -> sent to vim | direction
# U+2019 -> U+02DB left   U+2018 -> U+2018 down
# U+00E9 -> U+00E9 up     U+0131 -> U+0131 right
# Guard: clear any stale bindings from vim-tmux-navigator plugin if ever re-added
unbind -n "'"
unbind -n ˛
bind-key -n ’ run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys ˛) || tmux select-pane -L"
bind-key -n ‘ run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys ‘) || tmux select-pane -D"
bind-key -n é run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys é) || tmux select-pane -U"
bind-key -n ı run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys ı) || tmux select-pane -R"
bind-key -T copy-mode-vi ’ select-pane -L
bind-key -T copy-mode-vi ‘ select-pane -D
bind-key -T copy-mode-vi é select-pane -U
bind-key -T copy-mode-vi ı select-pane -R

# ── Catppuccin ────────────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'latte'

# Window tabs
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Pane borders
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_2}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_overlay_2}"

# Load catppuccin early so #{E:@catppuccin_status_*} is available for status-right
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# ── Status bar ────────────────────────────────────────────────────────────────
# Must be set AFTER catppuccin loads (variables are resolved at set time)
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# ── Vi mode + copy ────────────────────────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Custom bindings ───────────────────────────────────────────────────────────
bind-key j new-window -n sessionizer "~/developer/utils/tmux-sessionizer.sh"
bind-key l run-shell "~/developer/utils/tmux-sessionizer.sh ~/developer/api"
bind-key u run-shell "~/developer/utils/tmux-sessionizer.sh ~/developer/Frontend"
bind-key ö run-shell "~/developer/utils/tmux-sessionizer.sh ~"
bind-key å new-window -n kill_sessionizer "tmux list-sessions | fzf | awk '{print $1}' | xargs tmux kill-session -t"
bind-key C-r run-shell "~/developer/utils/start_backend.sh"
unbind -n ﬁ
unbind -n ø

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind © select-layout even-vertical
bind @ select-layout even-horizontal

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'Morantron/tmux-fingers'
set -g @fingers-key f
set -g @fingers-keyboard-layout 'colemak-homerow'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
