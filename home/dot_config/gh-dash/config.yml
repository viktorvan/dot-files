prSections:
    - title: My Pull Requests
      filters: is:open author:@me
    - title: Needs My Review
      filters: is:open repo:MedomaGithubOrg/Api
    - title: Involved
      filters: is:open involves:@me -author:@me
    - title: Closed
      filters: is:closed repo:MedomaGithubOrg/Api
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
    - title: Involved
      filters: is:open involves:@me -author:@me
notificationsSections:
    - title: All
      filters: ""
    - title: Created
      filters: reason:author
    - title: Participating
      filters: reason:participating
    - title: Mentioned
      filters: reason:mention
    - title: Review Requested
      filters: reason:review-requested
    - title: Assigned
      filters: reason:assign
    - title: Subscribed
      filters: reason:subscribed
    - title: Team Mentioned
      filters: reason:team-mention
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60

defaults:
    preview:
        open: true
        width: 0.45
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    notificationsLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30

keybindings:
  prs:
    - key: y
      name: Copy PR number
      command: >-
        printf "\033]52;c;$(printf %s '{{.PrNumber}}' | base64 -w 0)\a" > /dev/tty
    - key: Y
      name: Copy URL
      command: >-
        printf "\033]52;c;$(printf %s 'https://github.com/{{.RepoName}}/pull/{{.PrNumber}}' | base64 -w 0)\a" > /dev/tty
    - key: M
      name: Auto-merge (squash)
      command: gh pr merge --auto --squash --repo {{.RepoName}} {{.PrNumber}}
    - key: T
      command: >-
        tmux new-window '
          gh enhance -R {{.RepoName}} {{.PrNumber}}
        '
  issues:
    - key: y
      name: Copy issue number
      command: >-
        printf "\033]52;c;$(printf %s '{{.IssueNumber}}' | base64 -w 0)\a" > /dev/tty
    - key: Y
      name: Copy URL
      command: >-
        printf "\033]52;c;$(printf %s 'https://github.com/{{.RepoName}}/issues/{{.IssueNumber}}' | base64 -w 0)\a" > /dev/tty

repoPaths: {}
theme:
  colors:
    text:
      primary: "#4c4f69"
      secondary: "#7287fd"
      inverted: "#dce0e8"
      faint: "#5c5f77"
      warning: "#df8e1d"
      success: "#40a02b"
      error: "#d20f39"
    background:
      selected: "#ccd0da"
    border:
      primary: "#7287fd"
      secondary: "#bcc0cc"
      faint: "#ccd0da"

    ui:
        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
    icons:
        inline:
            newcontributor: "󰎔"
            contributor: ""
            collaborator: ""
            member: ""
            owner: ""
            unknownrole: "󰭙"
pager:
    diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
